name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Byte-compile sources
        run: python -m py_compile stash_viewer.py update_prices.py market_names.py steam_login.py extract_steam_token.py tools/extract_sprites.py
      - name: Import smoke check (no GUI)
        run: python -c "import update_prices; print('update_prices ok')"
